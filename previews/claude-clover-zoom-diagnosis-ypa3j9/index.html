<!DOCTYPE html>
<html lang="en">
<head>
  <base href="https://hadro.github.io/green-books/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Green Books Directory Explorer — IIIF Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,300;0,400;1,400&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gb-paper:       #faf8f3;
      --gb-paper-2:     #f0ece2;
      --gb-ink:         #161310;
      --gb-ink-soft:    #54504a;
      --gb-ink-faint:   #9a948a;
      --gb-rule-faint:  rgba(22, 19, 16, 0.12);
      --gb-accent:      #1d4d2e;
      --gb-highlight:   #c89028;
      --gb-font-display: "Newsreader", Georgia, serif;
      --gb-font-body:   "Source Sans 3", system-ui, sans-serif;
      --gb-font-mono:   "JetBrains Mono", ui-monospace, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--gb-paper);
      font-family: var(--gb-font-body);
      display: flex; flex-direction: column;
    }
    header {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 16px;
      padding: 10px 24px;
      background: var(--gb-paper-2);
      border-bottom: 1px solid var(--gb-rule-faint);
    }
    header h1 {
      font-family: var(--gb-font-display);
      font-weight: 300; font-size: 17px;
      color: var(--gb-ink); letter-spacing: -0.01em;
    }
    header h1 em { font-style: italic; color: var(--gb-accent); }
    header a {
      margin-left: auto;
      font-family: var(--gb-font-mono); font-size: 11px;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--gb-ink-soft); text-decoration: none;
    }
    header a:hover { color: var(--gb-accent); }
    #viewer-wrap { flex: 1; min-height: 0; position: relative; }
    clover-viewer { display: block; position: absolute; inset: 0; }
    clover-viewer > div { height: 100%; }
    #landing, #error {
      display: none; position: absolute; inset: 0;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; padding: 32px; text-align: center;
    }
    #landing.visible, #error.visible { display: flex; }
    #landing p {
      font-family: var(--gb-font-display); font-size: 16px;
      color: var(--gb-ink-soft); max-width: 480px; line-height: 1.6;
    }
    #landing a {
      display: inline-block; padding: 10px 22px;
      background: var(--gb-accent); color: var(--gb-paper);
      border-radius: 3px; text-decoration: none;
      font-family: var(--gb-font-body); font-weight: 600; font-size: 14px;
    }
    #landing a:hover { background: var(--gb-accent-deep, #143a22); }
    #error p { font-size: 13px; color: #b00; max-width: 520px; line-height: 1.5; }
    .gb-entry-subtitle {
      display: block;
      font-family: var(--gb-font-mono, ui-monospace, monospace);
      font-size: 11px; letter-spacing: 0.08em;
      color: var(--gb-ink-soft, #54504a);
      margin-top: 2px;
    }
  </style>
</head>
<body>

<header>
  <h1 id="viewer-heading">The <em>Green Book</em> Directory Explorer</h1>
  <a id="back-link" href="explorer.html">← Back to explorer</a>
</header>

<div id="viewer-wrap">
  <div id="landing">
    <p>This viewer opens specific pages from the digitized Green Book volumes.
       Use the explorer to find an entry and click its source link to open it here.</p>
    <a href="explorer.html">Open the Green Book Explorer</a>
  </div>
  <div id="error"><p id="error-msg"></p></div>
</div>

<script>
// NYPL info.json responses return "id":"http://iiif.nypl.org:443/..." — Chrome
// blocks HTTP requests from an HTTPS page. Rewrite those URLs for both fetch
// (info.json) and XMLHttpRequest (OSD tile loading) before Clover/OSD loads.
(function () {
  function fixNyplUrl(url) {
    return typeof url === 'string'
      ? url.replace(/^http:\/\/iiif\.nypl\.org(:\d+)?\//,'https://iiif.nypl.org/')
      : url;
  }
  const _fetch = window.fetch;
  window.fetch = function (input, init) {
    return _fetch.call(this, fixNyplUrl(input), init).then(function (resp) {
      // Also rewrite URLs embedded in JSON response bodies (info.json @id field)
      const ct = resp.headers.get('content-type') || '';
      if (!ct.includes('json')) return resp;
      return resp.text().then(function (text) {
        const fixed = text.replace(/http:\/\/iiif\.nypl\.org(:\d+)?\//g, 'https://iiif.nypl.org/');
        return new Response(fixed, { status: resp.status, statusText: resp.statusText, headers: resp.headers });
      });
    });
  };
  const _open = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (method, url) {
    return _open.apply(this, [method, fixNyplUrl(url)].concat(Array.prototype.slice.call(arguments, 2)));
  };
}());

const BASE_URL = "https://hadro.github.io/green-books";

// ── Helpers ──────────────────────────────────────────────────────────────────

function showError(msg) {
  document.getElementById("error-msg").textContent = msg;
  document.getElementById("error").classList.add("visible");
}

function serviceId(service) {
  if (!service) return "";
  const s = Array.isArray(service) ? service[0] : service;
  return (s && (s.id || s["@id"])) || "";
}

function buildCanvasIndex(manifest) {
  const index = {};
  for (const canvas of (manifest.items || [])) {
    try {
      const body = canvas.items[0].items[0].body;
      // Index by service base URL (primary)
      const svc = serviceId(body.service);
      if (svc) index[svc] = canvas.id;
      // Also index by body URL stripped to service base (NYPL canvas IDs are image URLs)
      if (body.id) index[body.id.replace(/\/full\/.*$/, "")] = canvas.id;
    } catch (e) {}
  }
  return index;
}

function buildCloverState(manifestId, canvasId, fragment) {
  const target = {
    type: "SpecificResource",
    source: { id: canvasId, type: "Canvas", partOf: [{ id: manifestId, type: "Manifest" }] },
  };
  if (fragment) target.selector = { type: "FragmentSelector", value: fragment };
  const state = {
    "@context": "http://iiif.io/api/presentation/3/context.json",
    id: canvasId + (fragment ? "#" + fragment : "") + "/content-state",
    type: "Annotation",
    motivation: ["contentState"],
    target,
  };
  return state;
}

function contentStateToBlobId(stateObj) {
  return URL.createObjectURL(
    new Blob([JSON.stringify(stateObj)], { type: "application/json" })
  );
}

// Parse a pixel "xywh=x,y,w,h" fragment (the only form this site produces —
// see canvas_fragment values in the CSV / explorer.html) into its width/height
// aspect ratio. Returns null for anything else, so callers can fall back to a
// weaker readiness check rather than assume a shape that may not hold.
function xywhAspect(fragment) {
  const m = /^xywh=(\d+),(\d+),(\d+),(\d+)$/.exec(fragment || "");
  if (!m) return null;
  const w = Number(m[3]), h = Number(m[4]);
  return (w > 0 && h > 0) ? w / h : null;
}

// Clover's own info-panel AnnotationItem is the only thing that actually
// zooms to a content-state fragment: it polls (1s interval) for its OSD
// overlay to exist, calls fitBounds() once, then stops. If that overlay is
// drawn before the tiled image finishes loading, its rect can be NaN
// (silent no-op zoom) — Clover redraws the overlay correctly once the image
// loads, but its own poll has already stopped by then. Rather than race
// Clover's interval, drive the zoom ourselves: each overlay is a light-DOM
// <button id="{content-state annotation id}"> with a keydown-Enter handler
// that calls fitBounds() on whatever rect the overlay currently has.
//
// A finite, non-zero rect isn't quite enough of a readiness signal on its
// own: testing against a slow image load showed Clover can also draw the
// overlay at a tiny (e.g. 4x4px), non-NaN placeholder position before the
// image is loaded — sane by a bare non-zero check, but not the real
// fragment position, and dispatching against it zooms to nowhere exactly
// like the NaN case. Since we already know the fragment's pixel aspect
// ratio, cross-check the overlay's on-screen aspect ratio against it before
// trusting the rect; a real (even mid-animation) draw of the fragment keeps
// that aspect ratio, while a placeholder does not.
//
// Small-viewport wrinkle: below Clover's ~768px WINDOW-width breakpoint,
// Viewer.tsx initializes the info panel closed, so the content-state
// AnnotationItem (which lives in that panel) never mounts, the overlay is
// never registered, and no zoom ever happens — phone deep links would land
// on an unzoomed page. Clover still renders its panel-toggle button (the
// only button carrying a data-aside-active attribute, aria-label "More
// Information"); clicking it mounts the panel and with it the content-state
// annotation + overlay. So while waiting for the overlay to EXIST: if the
// toggle reports the panel collapsed (aria-expanded="false"), click it — a
// no-op on desktop where the panel starts open.
//
// The panel is closed (manifest-back) as soon as the overlay element exists,
// BEFORE waiting for its rect to become sane and zooming. Order matters: at
// phone widths the opened panel covers the entire viewer and while it is
// open OSD never settles into real dimensions — on a slow image load the
// overlay stays a tiny placeholder indefinitely (observed at 400px), so
// waiting for a sane rect with the panel open deadlocks. The overlay button,
// its keydown handler, and its world-space rect all survive the close
// (verified at 1280px and 400px in stock 3.11.0 — unlike the old patched
// 3.4.0 bundle, where the back-click wiped zoom + highlight on mobile and
// index.html had to skip the auto-dismiss on small viewports). Closing
// unconditionally also means the zoom below always runs against the final,
// full-size OSD container, so it lands identically at every width.
function ensureZoomThenClosePanel(el, stateId, expectedAspect) {
  const POLL_MS = 250;
  const MAX_MS = 45000;
  const ASPECT_TOLERANCE = 0.2; // relative
  const TOGGLE_GRACE_MS = 1000;    // don't touch the toggle before Clover settles
  const TOGGLE_RETRY_MS = 3000;    // re-click at most this often if still collapsed
  let elapsed = 0;
  let lastToggleClick = -Infinity;
  let panelClosed = false;

  function openPanelIfCollapsed() {
    if (elapsed < TOGGLE_GRACE_MS || elapsed - lastToggleClick < TOGGLE_RETRY_MS) return;
    // Scoped to Clover's aside toggle: it is the only button carrying a
    // data-aside-active attribute (verified in 3.11.0 DOM at 400px and
    // 1280px), so this cannot match other aria-expanded widgets.
    const toggle = el.querySelector('button[data-aside-active][aria-expanded="false"]');
    if (toggle) {
      lastToggleClick = elapsed;
      toggle.click();
    }
  }

  function poll() {
    const overlay = document.getElementById(stateId); // light DOM (shadow: false)
    if (!overlay) {
      // Panel must have been open at least once for the overlay to exist.
      openPanelIfCollapsed();
    } else if (!panelClosed) {
      // Overlay registered — the panel has served its purpose; dismiss it
      // now so OSD gets its final dimensions and can finish loading.
      panelClosed = true;
      const btn = el.querySelector('[data-value="manifest-back"]');
      if (btn) btn.click();
    } else {
      const rect = overlay.getBoundingClientRect();
      const sane = Number.isFinite(rect.width) && Number.isFinite(rect.height) &&
        rect.width > 0 && rect.height > 0;
      const aspectOk = !expectedAspect ||
        Math.abs((rect.width / rect.height) - expectedAspect) / expectedAspect <= ASPECT_TOLERANCE;
      if (sane && aspectOk) {
        // Trigger Clover's own handler for the correct fitBounds rect.
        // Idempotent if Clover already zoomed on its own.
        overlay.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
        return;
      }
    }
    elapsed += POLL_MS;
    if (elapsed >= MAX_MS) return; // give up rather than zoom to a bogus rect
    setTimeout(poll, POLL_MS);
  }

  poll();
}

function launchClover(manifestId, cfUrl) {
  const wrap = document.getElementById("viewer-wrap");
  const old = wrap.querySelector("clover-viewer");
  if (old) old.remove();

  // Wait for the custom element to be defined before appending it.
  // On cold loads, clover.umd-3.11.0.js (~2 MB) can finish downloading
  // after the manifest fetches complete, leaving the element in the DOM as an
  // unknown element until Clover upgrades it.
  const cloverReady = customElements.whenDefined("clover-viewer");

  function attach(blobId, stateId, expectedAspect) {
    const el = document.createElement("clover-viewer");
    el.setAttribute("id", blobId);
    // Must always be present: Clover does an unguarded JSON.parse() of this
    // attribute. canvasHeight:"auto" gives full-height layout; the download
    // button and IIIF badge are hidden to match the site's chrome.
    el.setAttribute("options", JSON.stringify({
      canvasHeight: "auto", showDownload: false, showIIIFBadge: false,
    }));
    wrap.appendChild(el);
    // Only content-state loads (a specific canvas fragment) have a zoom
    // target and an info panel worth auto-dismissing. The no-cfUrl and
    // manifest-fetch-failure fallback paths below attach with just the bare
    // manifest URL — there's nothing to zoom to, so leave Clover's default
    // (open) info panel alone.
    if (stateId) ensureZoomThenClosePanel(el, stateId, expectedAspect);
  }

  if (!cfUrl) {
    cloverReady.then(() => attach(manifestId));
    return;
  }

  const fragment = cfUrl.includes("#") ? cfUrl.split("#")[1] : "";
  const cfBase   = cfUrl.includes("#") ? cfUrl.split("#")[0] : cfUrl;

  // Run the manifest fetch and Clover registration in parallel; attach only
  // when both are ready so the element is immediately active on connection.
  Promise.all([cloverReady, fetch(manifestId).then(r => r.json())])
    .then(([, manifest]) => {
      const index = buildCanvasIndex(manifest);
      const svcBase = cfBase.replace(/\/full\/.*$/, "");
      const canvasId = index[svcBase] || index[cfBase] || cfBase;
      const state = buildCloverState(manifestId, canvasId, fragment);
      attach(contentStateToBlobId(state), state.id, xywhAspect(fragment));
    })
    .catch(() => {
      cloverReady.then(() => attach(manifestId));
    });
}

// ── Header: populate from URL params ─────────────────────────────────────────

(function () {
  const params = new URLSearchParams(location.search);
  const cf   = params.get("cf");
  const name = params.get("name");
  if (cf) {
    document.getElementById("back-link").href = "explorer.html?cf=" + encodeURIComponent(cf);
  }
  if (name) {
    // Inject "Entry: [name]" as subtitle inside Clover's own header once it renders.
    const obs = new MutationObserver(() => {
      const titleEl = document.querySelector(".clover-viewer-header .label");
      if (!titleEl || titleEl.querySelector(".gb-entry-subtitle")) return;
      const sub = document.createElement("span");
      sub.className = "gb-entry-subtitle";
      sub.textContent = "Entry: " + name;
      titleEl.appendChild(sub);
      obs.disconnect();
    });
    obs.observe(document.getElementById("viewer-wrap"), { childList: true, subtree: true });
  }
})();

// ── Route ────────────────────────────────────────────────────────────────────

const _params = new URLSearchParams(location.search);
const cf    = _params.get("cf");
const name  = _params.get("name") || "";

if (!cf) {
  document.getElementById("landing").classList.add("visible");
} else {
  const m = cf.match(/\/iiif\/\d+\/(\d+)\//);
  if (!m) {
    showError("Unrecognised canvas fragment URL: " + cf);
  } else {
    const imageId = m[1];
    Promise.all([
      fetch("image_to_volume.json").then(r => r.json()).catch(() => ({})),
      fetch("travel_guides_image_to_volume.json").then(r => r.json()).catch(() => ({})),
    ])
      .then(([gbLookup, tgLookup]) => {
        const uuid = gbLookup[imageId] || tgLookup[imageId];
        if (!uuid) {
          showError("No volume found for image ID " + imageId + ". The lookup table may be out of date.");
          return;
        }
        launchClover(BASE_URL + "/manifests/" + uuid + "/manifest.json", cf);
      })
      .catch(err => showError("Could not load volume index: " + err.message));
  }
}
</script>

<script src="previews/claude-clover-zoom-diagnosis-ypa3j9/clover.umd-3.11.0.js"></script>
<!-- privacy-friendly analytics via GoatCounter -->
<!-- Strip ?cf=... so every entry view aggregates under /index.html instead of fragmenting per-entry -->
<script>window.goatcounter = { path: function (p) { return p.split('?')[0]; } };</script>
<script data-goatcounter="https://green-books.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
