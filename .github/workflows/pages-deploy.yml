# Build the static site and publish to the `gh-pages` branch:
#   - pushes to `main` deploy the full repo to the root of `gh-pages`
#   - pushes to any other branch deploy that branch's HTML files (only) to
#     `gh-pages/previews/<branch-slug>/`
#   - deleting any non-main branch removes its preview folder
#
# Preview deploys inject a `<base href>` so relative fetches in the HTML
# (CSVs, manifests, canvas-map JSON) resolve back to main's data — keeps
# each preview to a few hundred KB instead of duplicating ~32 MB of CSVs.
#
# To enable previews: in repo Settings → Pages, set Source to "Deploy from
# a branch" and choose the `gh-pages` branch / root (after the first run
# of this workflow creates that branch).

name: Deploy to GitHub Pages

on:
  push:
    branches-ignore:
      - gh-pages
  delete:

# Only run the most recent push per branch; older runs are wasted work.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute deploy target
        id: target
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ "$BRANCH" = "main" ]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
            echo "subdir=."     >> "$GITHUB_OUTPUT"
          else
            # Slugify branch name for use as a path segment.
            SLUG="${BRANCH//\//-}"
            echo "is_main=false"           >> "$GITHUB_OUTPUT"
            echo "subdir=previews/$SLUG"   >> "$GITHUB_OUTPUT"
            echo "slug=$SLUG"              >> "$GITHUB_OUTPUT"
          fi

      - name: Build deploy artifact
        env:
          IS_MAIN: ${{ steps.target.outputs.is_main }}
          SLUG: ${{ steps.target.outputs.slug }}
        run: |
          set -euo pipefail
          mkdir _publish
          # .nojekyll keeps Pages from running Jekyll on the site, which
          # would otherwise strip files/folders starting with `_`.
          touch _publish/.nojekyll
          if [ "$IS_MAIN" = "true" ]; then
            # Full site: everything except repo plumbing.
            rsync -a \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='_publish' \
              ./ _publish/
          else
            # Preview: HTML files (with `<base href>` injected so relative
            # fetches resolve to main's data files) plus root-level JS —
            # code the branch may have changed (e.g. gb-matching.js) must
            # ship with the preview, not resolve to main's copy. Because the
            # base href points at the site root, local script srcs must be
            # rewritten to the preview folder explicitly.
            #
            # Previews are also de-indexed. A robots.txt under /green-books/
            # cannot do this: crawlers only honour robots.txt at the domain
            # root (https://hadro.github.io/robots.txt), which belongs to a
            # different repo. So each preview page gets a `noindex` meta and
            # has its `<link rel="canonical">` stripped — otherwise every
            # preview would be a crawlable duplicate of a real page, and
            # stale ones would linger in the index until the branch is
            # deleted.
            BASE_TAG='  <base href="https://hadro.github.io/green-books/">'
            NOINDEX_TAG='  <meta name="robots" content="noindex, nofollow">'
            for f in *.html; do
              awk -v base="$BASE_TAG" -v noindex="$NOINDEX_TAG" '
                tolower($0) ~ /<link[^>]*rel="canonical"/ { next }
                { print }
                !injected && tolower($0) ~ /<head[^>]*>/ {
                  print base; print noindex; injected = 1
                }
              ' "$f" > "_publish/$f"
            done
            cp *.js _publish/ 2>/dev/null || true
            for js in *.js; do
              [ -f "$js" ] || continue
              sed -i "s|src=\"$js\"|src=\"previews/$SLUG/$js\"|g" _publish/*.html
            done
          fi
          ls -la _publish

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_publish
          destination_dir: ${{ steps.target.outputs.subdir }}
          # keep_files preserves whatever else is in gh-pages — for main
          # deploys this keeps the `previews/` subtree; for preview deploys
          # it keeps main's content + other previews intact.
          keep_files: true
          commit_message: "Deploy ${{ github.ref_name }} @ ${{ github.sha }}"

      - name: Summary
        run: |
          if [ "${{ steps.target.outputs.is_main }}" = "true" ]; then
            echo "Deployed main to gh-pages root." >> "$GITHUB_STEP_SUMMARY"
            echo "Live at https://hadro.github.io/green-books/" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deployed preview for \`${GITHUB_REF#refs/heads/}\`." >> "$GITHUB_STEP_SUMMARY"
            echo "Preview URL: https://hadro.github.io/green-books/previews/${{ steps.target.outputs.slug }}/" >> "$GITHUB_STEP_SUMMARY"
          fi

  cleanup-preview:
    # Fires when a branch is deleted. Removes that branch's preview folder
    # from gh-pages so the site doesn't accumulate stale URLs. Hard guarded
    # against deleting main / gh-pages itself.
    if: >-
      github.event_name == 'delete' &&
      github.event.ref_type == 'branch' &&
      github.event.ref != 'main' &&
      github.event.ref != 'gh-pages'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Remove preview folder
        env:
          DELETED_REF: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          SLUG="${DELETED_REF//\//-}"
          PREVIEW="previews/$SLUG"
          if [ ! -d "$PREVIEW" ]; then
            echo "No preview folder for \`$DELETED_REF\` — nothing to clean." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git rm -rf "$PREVIEW"
          git commit -m "Remove preview for deleted branch $DELETED_REF"
          git push origin gh-pages
          echo "Removed \`$PREVIEW\` from gh-pages." >> "$GITHUB_STEP_SUMMARY"
